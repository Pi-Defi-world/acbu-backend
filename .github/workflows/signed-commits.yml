name: Signed Commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify signed commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # W11-INC-008: advisory report for the GitHub branch protection rule.
      # Every commit in the PR is checked for a GitHub-verified signature. The
      # step is report-only until maintainers have registered signing keys; the
      # authoritative enforcement is the "Require signed commits" setting.
      - name: Verify signed commits
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/check-signed-commits.js
