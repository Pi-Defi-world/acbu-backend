name: Temporary regenerate pnpm lockfile

on:
  push:
    branches:
      - fix/w11-1368-wasm-integrity-gate
    paths:
      - '.github/workflows/temporary-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    name: Regenerate and validate dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download exact source commit without broken gitlink
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --silent --show-error --location --retry 3 \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            | tar -xz --strip-components=1 -C source
          test -f source/package.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.33.1"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Regenerate lock with pinned package manager
        working-directory: source
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --lockfile-only --ignore-scripts --frozen-lockfile
          test -s pnpm-lock.yaml
          echo "Generated and frozen-validated lockfile"

      - name: Upload regenerated lockfile for source review
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-lockfile-fixed
          path: source/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 3

      - name: Commit regenerated lockfile to this exact branch
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const { GH_TOKEN, REPO, BRANCH } = process.env;
            const url = 'https://api.github.com/repos/' + REPO + '/contents/pnpm-lock.yaml';
            const headers = {
              Authorization: 'Bearer ' + GH_TOKEN,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'acbu-lockfile-refresh'
            };
            const existing = await fetch(url + '?ref=' + encodeURIComponent(BRANCH), { headers });
            if (!existing.ok) throw new Error('Unable to fetch lockfile SHA: ' + existing.status + ' ' + (await existing.text()));
            const { sha } = await existing.json();
            const body = {
              message: 'chore(lockfile): synchronize pnpm lock with package overrides',
              branch: BRANCH,
              sha,
              content: fs.readFileSync('pnpm-lock.yaml').toString('base64')
            };
            const result = await fetch(url, {
              method: 'PUT',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            if (!result.ok) throw new Error('Unable to commit lockfile: ' + result.status + ' ' + (await result.text()));
            const saved = await result.json();
            console.log('Regenerated lockfile committed:', saved.commit.sha);
          })().catch(e => { console.error(e.message); process.exitCode = 1; });
          NODE
