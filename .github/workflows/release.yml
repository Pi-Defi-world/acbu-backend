name: Release & Artifact Publish

# Releases are component-scoped. A tag names exactly one package:
#   backend@v1.2.0    -> backend API server (repository root)
#   frontend@v2.1.0   -> frontend web app (frontend/)
#   contracts@v0.8.0  -> Soroban contracts (contracts/)
# The legacy bare tag v1.2.0 is still accepted as a backend release so older
# automation keeps working, but new releases must use the component form.
# See docs/MULTI_PACKAGE_RELEASES.md for the full release process.
on:
  push:
    tags:
      - "backend@v[0-9]+.[0-9]+.[0-9]+*"
      - "frontend@v[0-9]+.[0-9]+.[0-9]+*"
      - "contracts@v[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. backend@v1.0.1, frontend@v2.1.0, contracts@v0.8.0)"
        required: true
      dry_run:
        description: "Dry run (build artifacts without publishing to GHCR/Releases)"
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ── Step 0: Resolve which package this tag releases ─────────────────────
  resolve-release:
    name: Resolve Release Target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      package: ${{ steps.release.outputs.package }}
      version: ${{ steps.release.outputs.version }}
      version_tag: ${{ steps.release.outputs.version_tag }}
      git_tag: ${{ steps.release.outputs.git_tag }}
      release_name: ${{ steps.release.outputs.release_name }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      release_notes: ${{ steps.release.outputs.release_notes }}
      directory: ${{ steps.release.outputs.directory }}
      legacy: ${{ steps.release.outputs.legacy }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      image_tags: ${{ steps.release.outputs.image_tags }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          # Caller-controlled values enter as data, never as interpolated script text.
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual release requested for tag: ${RAW_TAG}"
          fi

          node scripts/release/resolve-release.js \
            --ref "${RAW_TAG}" \
            --github-output "${GITHUB_OUTPUT}"

          # Pin every downstream checkout to the tag's commit, not the dispatch ref.
          if ! COMMIT_SHA="$(git rev-parse --verify "refs/tags/${RAW_TAG}^{commit}" 2>/dev/null)"; then
            echo "::error::Tag ${RAW_TAG} was not found in this repository. Push the tag before releasing."
            exit 1
          fi
          echo "commit_sha=${COMMIT_SHA}" >> "${GITHUB_OUTPUT}"

  # ── Step 1: Secret scan must pass before release ────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.2"
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -zxf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --verbose --redact

  # ── Step 2: Quality gate & package the released component ──────────────
  build-and-test:
    name: Build & Verify ${{ needs.resolve-release.outputs.package }} Artifact
    needs: [secret-scan, resolve-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release target exists
        run: |
          PACKAGE="${{ needs.resolve-release.outputs.package }}"
          TAG="${{ needs.resolve-release.outputs.git_tag }}"

          if [ "${PACKAGE}" = "frontend" ] && [ ! -f frontend/package.json ]; then
            echo "::error::Tag ${TAG} releases the frontend, but frontend/package.json is missing from this ref. Merge the monorepo consolidation (frontend/ tree) before tagging a frontend release."
            exit 1
          fi
          if [ "${PACKAGE}" = "contracts" ] && [ ! -f contracts/Cargo.toml ]; then
            echo "::error::Tag ${TAG} releases the contracts, but contracts/Cargo.toml is missing from this ref. Merge the monorepo consolidation (contracts/ tree) before tagging a contracts release."
            exit 1
          fi

      # ── Backend toolchain ────────────────────────────────────────────────
      - name: Setup pnpm (backend)
        if: needs.resolve-release.outputs.package == 'backend'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.33.1"

      - name: Setup Node.js (backend)
        if: needs.resolve-release.outputs.package == 'backend'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies (backend)
        if: needs.resolve-release.outputs.package == 'backend'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (backend)
        if: needs.resolve-release.outputs.package == 'backend'
        run: pnpm prisma:generate

      - name: Compile TypeScript (backend)
        if: needs.resolve-release.outputs.package == 'backend'
        run: pnpm build

      # ── Frontend toolchain ──────────────────────────────────────────────
      - name: Setup pnpm (frontend)
        if: needs.resolve-release.outputs.package == 'frontend'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.15.0"

      - name: Setup Node.js (frontend)
        if: needs.resolve-release.outputs.package == 'frontend'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        if: needs.resolve-release.outputs.package == 'frontend'
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # ── Contracts toolchain ─────────────────────────────────────────────
      - name: Setup Rust toolchain (contracts)
        if: needs.resolve-release.outputs.package == 'contracts'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          targets: wasm32-unknown-unknown

      - name: Build Soroban contracts
        if: needs.resolve-release.outputs.package == 'contracts'
        run: |
          cargo build --release --locked \
            --target wasm32-unknown-unknown \
            --manifest-path contracts/Cargo.toml

      # ── Package the component's release artifact ─────────────────────────
      - name: Package Release Tarball
        run: |
          set -euo pipefail

          PACKAGE="${{ needs.resolve-release.outputs.package }}"
          ARTIFACT="${{ needs.resolve-release.outputs.artifact_name }}"
          mkdir -p release-dist

          if [ "${PACKAGE}" = "backend" ]; then
            tar -czf "release-dist/${ARTIFACT}" \
              dist/ \
              prisma/ \
              package.json \
              pnpm-lock.yaml \
              README.md \
              CHANGELOG.md
          elif [ "${PACKAGE}" = "frontend" ]; then
            STAGE="$(mktemp -d)"
            cp -R frontend/.next "${STAGE}/.next"
            cp frontend/package.json frontend/pnpm-lock.yaml "${STAGE}/"
            tar -czf "release-dist/${ARTIFACT}" -C "${STAGE}" .
          elif [ "${PACKAGE}" = "contracts" ]; then
            STAGE="$(mktemp -d)"
            mkdir -p "${STAGE}/wasm"
            find contracts/target/wasm32-unknown-unknown/release \
              -maxdepth 1 -name '*.wasm' \
              -exec cp {} "${STAGE}/wasm/" \;

            if [ -z "$(ls -A "${STAGE}/wasm")" ]; then
              echo "::error::No WASM artifacts were produced under contracts/target/wasm32-unknown-unknown/release."
              exit 1
            fi

            cp contracts/Cargo.toml "${STAGE}/"
            if [ -f contracts/Cargo.lock ]; then
              cp contracts/Cargo.lock "${STAGE}/"
            fi
            tar -czf "release-dist/${ARTIFACT}" -C "${STAGE}" .
          else
            echo "::error::Unsupported package ${PACKAGE}."
            exit 1
          fi

          cd release-dist
          sha256sum "${ARTIFACT}" > SHA256SUMS

      - name: Upload Release Archive Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-archive
          path: release-dist/

  # ── Step 3: Publish the backend container image ────────────────────────
  publish-container:
    name: Build & Publish Backend Container Image
    needs: [build-and-test, resolve-release]
    if: ${{ needs.resolve-release.outputs.package == 'backend' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit_sha }}
          persist-credentials: false

      - name: Resolve image tags
        id: image
        run: |
          : > image-tags.txt
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              echo "ghcr.io/${GITHUB_REPOSITORY}:${tag}" >> image-tags.txt
            fi
          done <<< "${{ needs.resolve-release.outputs.image_tags }}"

          echo "tags<<EOF" >> "${GITHUB_OUTPUT}"
          cat image-tags.txt >> "${GITHUB_OUTPUT}"
          echo "EOF" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push release image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ACBU Backend API Server
            org.opencontainers.image.description=Production release of ACBU Backend
            org.opencontainers.image.version=${{ needs.resolve-release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.resolve-release.outputs.commit_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 4: Create the package-specific GitHub Release ─────────────────
  github-release:
    name: Create ${{ needs.resolve-release.outputs.release_name }} Release
    needs: [resolve-release, build-and-test, publish-container]
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      (needs.publish-container.result == 'success' || needs.publish-container.result == 'skipped') &&
      github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Release Archive Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-archive
          path: release-dist

      - name: Extract Release Notes from component CHANGELOG
        id: notes
        run: |
          set -euo pipefail

          PACKAGE="${{ needs.resolve-release.outputs.package }}"
          VERSION="${{ needs.resolve-release.outputs.version }}"
          NOTES_FILE="${{ needs.resolve-release.outputs.release_notes }}"

          {
            echo "**Package:** \`${PACKAGE}\`"
            echo "**Version:** \`${VERSION}\`"
            echo ""
          } > RELEASE_NOTES.md

          # Match the exact version heading (bracketed or bare) so a stable
          # release never picks up a prerelease section, and stop at the next
          # heading without deleting the last line when the section ends at EOF.
          SECTION=""
          if [ -f "${NOTES_FILE}" ]; then
            ESC_VERSION="$(printf '%s' "${VERSION}" | sed 's/[][\.^$*+?(){}|]/\\&/g')"
            SECTION="$(awk -v ver="${ESC_VERSION}" '
              found && /^## / { exit }
              $0 ~ "^## (\\[" ver "\\]|" ver "([[:space:]]|$))" { found = 1 }
              found { print }
            ' "${NOTES_FILE}")"
          fi

          if [ -n "${SECTION}" ]; then
            printf '%s\n' "${SECTION}" >> RELEASE_NOTES.md
          else
            echo "Release ${PACKAGE} v${VERSION}" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "Automated reproducible production release for commit \`${{ needs.resolve-release.outputs.commit_sha }}\`." >> RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d190 # v2.0.8
        with:
          tag_name: ${{ needs.resolve-release.outputs.git_tag }}
          name: ${{ needs.resolve-release.outputs.release_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.resolve-release.outputs.prerelease == 'true' }}
          files: |
            release-dist/*.tar.gz
            release-dist/SHA256SUMS
