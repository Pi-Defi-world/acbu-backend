name: Normalize source formatting

on:
  push:
    branches:
      - fix/w11-inc-012-extend-security-scan-coverage
    paths:
      - src/**/*.ts
      - .github/workflows/normalize-source-formatting.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/w11-inc-012-extend-security-scan-coverage
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository lint fixes
        run: |
          pnpm exec eslint src --ext .ts --fix
          pnpm exec prettier --write "src/**/*.ts"
      - name: Commit formatting fixes
        run: |
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: apply repository ESLint and Prettier fixes"
            git push
          fi
