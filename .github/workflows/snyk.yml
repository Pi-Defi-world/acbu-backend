name: Snyk Dependency Scan

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch: {}
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Decide whether Snyk can run
        id: gate
        shell: bash
        run: |
          if [[ -z "${SNYK_TOKEN}" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Snyk scan because SNYK_TOKEN is not configured."
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Snyk scan because secrets are unavailable to fork pull requests."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.should_run == 'true'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.should_run == 'true'
        with:
          version: "10.33.1"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.should_run == 'true'
        with:
          node-version: "22"
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Snyk CLI
        if: steps.gate.outputs.should_run == 'true'
        run: npm install -g snyk

      - name: Run Snyk test
        if: steps.gate.outputs.should_run == 'true'
        run: snyk test --severity-threshold=high

      - name: Skip summary
        if: steps.gate.outputs.should_run != 'true'
        # A bare echo left this job showing a plain green pass with no
        # explanation, which could read as "Snyk ran and found nothing."
        # Write to the job summary so a skipped run is clearly distinguishable
        # from a clean scan, and points reviewers at what actually gates
        # merges when Snyk itself did not run (see SECURITY.md).
        run: |
          {
            echo "## Snyk scan skipped"
            echo ""
            echo "SNYK_TOKEN is not configured for this run (or this is a fork PR, which never gets repository secrets), so no Snyk scan ran."
            echo ""
            echo "Dependency vulnerabilities on this PR are still gated by:"
            echo "- \`pnpm audit --audit-level high\` in the main CI workflow's Lint job (no token required)"
            echo "- the Dependency Review check on every PR (no token required)"
            echo ""
            echo "See SECURITY.md for details."
          } >> "$GITHUB_STEP_SUMMARY"
