name: 'Dependency Review'
on:
  pull_request:
    branches: [ "main", "dev", "develop" ]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5
        # continue-on-error: the action hard-fails when GitHub Dependency Graph is
        # disabled on the repository (a repo settings toggle). Until it is enabled
        # under Settings → Security & analysis → Dependency graph, treat this as
        # informational rather than a hard gate so it doesn't block valid PRs.
        continue-on-error: true
        with:
          fail-on-severity: high
          # This configures it to only block PRs if they introduce NEW vulnerabilities
          # which satisfies: "gate on new high/critical vulns"
