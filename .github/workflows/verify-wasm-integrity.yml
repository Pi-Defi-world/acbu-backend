name: Verify WASM Integrity

# W11-CAR-015: compile audited source and verify all nine contract binaries
# against independently approved SHA-256 values. Missing artifacts must fail.
on:
  push:
    branches: [main, dev, develop]
    paths:
      - '.wasm-checksums'
      - 'WASM_INTEGRITY.md'
      - 'scripts/ci/verify-wasm-integrity.js'
      - 'tests/wasmIntegrity.test.js'
      - '.github/workflows/verify-wasm-integrity.yml'
  pull_request:
    branches: [main, dev, develop]
    paths:
      - '.wasm-checksums'
      - 'WASM_INTEGRITY.md'
      - 'scripts/ci/verify-wasm-integrity.js'
      - 'tests/wasmIntegrity.test.js'
      - '.github/workflows/verify-wasm-integrity.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      backend-ref:
        description: Backend revision to validate
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify-wasm-integrity:
    name: Verify nine pinned contract WASMs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout backend checksum lock and verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: backend
          ref: ${{ inputs.backend-ref || github.sha }}
          persist-credentials: false

      - name: Run integrity verifier regression tests
        run: node --test backend/tests/wasmIntegrity.test.js

      - name: Checkout audited contract source at immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pi-Defi-world/acbu-smart-contract
          # Changes to this pin require an independently reviewed lock update.
          ref: 3160312a7c9334447be81ebe17ca2f5e3fa83057
          path: contract-source
          persist-credentials: false

      - name: Install pinned Rust and wasm32 target
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: '1.88.0'
          targets: wasm32-unknown-unknown

      - name: Verify vendored token WASM
        working-directory: contract-source
        run: bash scripts/fetch_token_wasm.sh && bash scripts/verify_wasm_hash.sh

      - name: Build nine release WASMs from pinned source
        working-directory: contract-source
        env:
          RUSTUP_TOOLCHAIN: '1.88.0'
        run: |
          set -euo pipefail
          cargo build --locked --release --target wasm32-unknown-unknown \
            -p acbu_burning \
            -p acbu_escrow \
            -p acbu_lending_pool \
            -p acbu_minting \
            -p acbu_multisig \
            -p acbu_oracle \
            -p acbu_reserve_tracker \
            -p acbu_savings_vault \
            -p zk_verifier

      - name: Generate candidate digests for independent security review
        run: |
          node backend/scripts/ci/verify-wasm-integrity.js \
            --dir contract-source/target/wasm32-unknown-unknown/release \
            --print-candidates > wasm-candidates.sha256
          echo 'Candidate hashes need manual audit; do not auto-approve these.'

      - name: Require exact match with approved SHA-256 lock
        run: |
          node backend/scripts/ci/verify-wasm-integrity.js \
            --dir contract-source/target/wasm32-unknown-unknown/release \
            --lock backend/.wasm-checksums

      - name: Publish candidate checksums for maintainer review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-wasm-sha256
          path: wasm-candidates.sha256
          if-no-files-found: ignore
          retention-days: 7
