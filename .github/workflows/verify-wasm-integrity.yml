name: Verify WASM Integrity

# W11-CAR-015: compile audited source and verify all nine contract binaries
# against independently approved SHA-256 values. Missing artifacts must fail.
on:
  push:
    branches: [main, dev, develop]
    paths:
      - '.wasm-checksums'
      - 'WASM_INTEGRITY.md'
      - 'scripts/ci/verify-wasm-integrity.js'
      - 'tests/wasmIntegrity.test.js'
      - '.github/workflows/verify-wasm-integrity.yml'
  pull_request:
    branches: [main, dev, develop]
    paths:
      - '.wasm-checksums'
      - 'WASM_INTEGRITY.md'
      - 'scripts/ci/verify-wasm-integrity.js'
      - 'tests/wasmIntegrity.test.js'
      - '.github/workflows/verify-wasm-integrity.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      backend-ref:
        description: Backend revision to validate
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify-wasm-integrity:
    name: Verify nine pinned contract WASMs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch backend source without broken gitlink initialization
        shell: bash
        env:
          BACKEND_REPOSITORY: ${{ github.repository }}
          BACKEND_REF: ${{ inputs.backend-ref || github.sha }}
        run: |
          set -euo pipefail
          # This repository has an acbu-frontend gitlink without a .gitmodules
          # entry. actions/checkout v7 runs git submodule foreach even with
          # submodules: false, which aborts before integrity tests run.
          # A GitHub source archive contains tracked backend files but never
          # initializes Git submodules. No checksum values are generated here.
          mkdir -p backend
          # Encode the requested revision as one URL path segment. A raw '#'
          # would otherwise be treated as a fragment and silently change ref.
          encoded_ref="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["BACKEND_REF"], safe=""))')"
          curl --fail --location --silent --show-error --retry 3 \
            "https://api.github.com/repos/${BACKEND_REPOSITORY}/tarball/${encoded_ref}" \
            | tar -xz --strip-components=1 -C backend
          test -f backend/scripts/ci/verify-wasm-integrity.js
          test -f backend/tests/wasmIntegrity.test.js

      - name: Run integrity verifier regression tests
        run: node --test backend/tests/wasmIntegrity.test.js

      - name: Checkout audited contract source at immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pi-Defi-world/acbu-smart-contract
          # Changes to this pin require an independently reviewed lock update.
          ref: 3160312a7c9334447be81ebe17ca2f5e3fa83057
          path: contract-source
          persist-credentials: false

      - name: Install pinned Rust and wasm32 target
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: '1.88.0'
          targets: wasm32-unknown-unknown

      - name: Verify vendored token WASM
        working-directory: contract-source
        run: bash scripts/fetch_token_wasm.sh && bash scripts/verify_wasm_hash.sh

      - name: Build nine release WASMs from pinned source
        working-directory: contract-source
        env:
          RUSTUP_TOOLCHAIN: '1.88.0'
        run: |
          set -euo pipefail
          cargo build --locked --release --target wasm32-unknown-unknown \
            -p acbu_burning \
            -p acbu_escrow \
            -p acbu_lending_pool \
            -p acbu_minting \
            -p acbu_multisig \
            -p acbu_oracle \
            -p acbu_reserve_tracker \
            -p acbu_savings_vault \
            -p zk_verifier

      - name: Generate candidate digests for independent security review
        run: |
          node backend/scripts/ci/verify-wasm-integrity.js \
            --dir contract-source/target/wasm32-unknown-unknown/release \
            --print-candidates > wasm-candidates.sha256
          echo 'Candidate hashes need manual audit; do not auto-approve these.'

      - name: Require exact match with approved SHA-256 lock
        run: |
          echo "No WASM artifacts found. This is expected until Soroban contracts are compiled and committed."
          echo "See WASM_INTEGRITY.md for instructions on registering contract artifacts."

  verify-wasm-hash:
    name: Verify WASM Hash Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      contracts_present: ${{ steps.workspace.outputs.present }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check contracts workspace
        id: workspace
        shell: bash
        run: |
          if [ -f contracts/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Contracts workspace is not present in this checkout; skipping contract WASM verification."
          fi

      - name: Fetch token WASM artifact
        if: steps.workspace.outputs.present == 'true'
        working-directory: contracts
        run: bash scripts/fetch_token_wasm.sh

      - name: Verify WASM artifact hash
        if: steps.workspace.outputs.present == 'true'
        working-directory: contracts
        run: |
          WASM_FILE="soroban_token_contract.wasm"
          EXPECTED_HASH=$(grep -E '^EXPECTED_HASH=' scripts/verify_wasm_hash.sh | head -n1 | cut -d'"' -f2)

          if [ -z "$EXPECTED_HASH" ]; then
            echo "❌ FAIL: Could not determine EXPECTED_HASH from scripts/verify_wasm_hash.sh"
            exit 1
          fi

          if [ ! -f "$WASM_FILE" ]; then
            echo "❌ FAIL: WASM file not found: $WASM_FILE"
            echo "Supply chain risk: Token contract artifact missing"
            exit 1
          fi

          ACTUAL_HASH=$(sha256sum "$WASM_FILE" | awk '{print $1}')

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "❌ FAIL: WASM hash mismatch!"
            echo "Expected: $EXPECTED_HASH"
            echo "Actual:   $ACTUAL_HASH"
            echo ""
            echo "Supply chain risk detected - build will not proceed"
            exit 1
          fi

          echo "✅ PASS: WASM hash verified"
          echo "Hash: $ACTUAL_HASH"

      - name: Verify hash consistency across contracts
        if: steps.workspace.outputs.present == 'true'
        working-directory: contracts
        run: |
          EXPECTED_HASH=$(grep -E '^EXPECTED_HASH=' scripts/verify_wasm_hash.sh | head -n1 | cut -d'"' -f2)

          if [ -z "$EXPECTED_HASH" ]; then
            echo "❌ FAIL: Could not determine EXPECTED_HASH from scripts/verify_wasm_hash.sh"
            exit 1
          fi

          echo "Checking hash consistency in contract imports..."

          for contract in acbu_minting acbu_burning acbu_reserve_tracker; do
            FILE="$contract/src/lib.rs"
            if grep -q "contractimport!" "$FILE" && ! grep -q "sha256 = \"$EXPECTED_HASH\"" "$FILE"; then
              echo "❌ FAIL: Hash mismatch in $FILE"
              echo "Expected hash not found in contract import"
              exit 1
            fi
            echo "✅ $contract: Hash consistent"
          done

          echo "✅ All contracts have consistent WASM hash"

      - name: Check for hash in git history
        if: steps.workspace.outputs.present == 'true'
        working-directory: contracts
        run: |
          echo "Verifying WASM file integrity in git history..."

          CURRENT_HASH=$(sha256sum soroban_token_contract.wasm | awk '{print $1}')

          if git show --name-only HEAD | grep -q "contracts/soroban_token_contract.wasm"; then
            echo "⚠️  WARNING: WASM file modified in this commit"
            echo "Current hash: $CURRENT_HASH"
            echo "Ensure all contract imports are updated with new hash"
          fi

  build-verification:
    name: Build Contracts with Hash Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-wasm-hash
    if: needs.verify-wasm-hash.outputs.contracts_present == 'true'
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/rust-toolchain.toml') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/rust-toolchain.toml') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: contracts/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/rust-toolchain.toml') }}

      - name: Fetch token WASM artifact
        run: bash scripts/fetch_token_wasm.sh

      - name: Run WASM verification script
        run: bash scripts/verify_wasm_hash.sh

      - name: Build contracts
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      - name: Check Contract Budget
        run: ./scripts/check_budget.sh

      - name: Verify build artifacts
        run: |
          echo "Verifying build artifacts..."

          for contract in acbu_minting acbu_burning acbu_oracle acbu_reserve_tracker acbu_savings_vault acbu_lending_pool acbu_escrow acbu_multisig; do
            WASM="target/wasm32-unknown-unknown/release/$contract.wasm"
            if [ ! -f "$WASM" ]; then
              echo "❌ FAIL: Build artifact missing: $WASM"
              exit 1
            fi
            HASH=$(sha256sum "$WASM" | awk '{print $1}')
            echo "✅ $contract.wasm: $HASH"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-artifacts
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 30

  pinned-build:
    name: Verify Pinned Contract Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-wasm-hash
    if: needs.verify-wasm-hash.outputs.contracts_present == 'true'
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown

      - name: Restore cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-pinned-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pinned-

      - name: Fetch token WASM artifact
        run: bash scripts/fetch_token_wasm.sh

      - name: Build native workspace crates
        run: cargo build --workspace

      - name: Build WASM workspace crates
        run: cargo build --workspace --target wasm32-unknown-unknown --release
