name: Verify WASM Integrity

on:
  push:
    branches: [main, dev, develop]
    paths:
      - "contracts/**"
      - "wasm/**"
      - ".wasm-checksums"
      - ".github/workflows/verify-wasm-integrity.yml"
  pull_request:
    branches: [main, dev, develop]
    paths:
      - "contracts/**"
      - "wasm/**"
      - ".wasm-checksums"
      - ".github/workflows/verify-wasm-integrity.yml"
  # Allow manual runs to verify integrity on demand
  workflow_dispatch:

jobs:
  verify-wasm-integrity:
    name: Verify WASM Checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for WASM artifacts
        id: find-wasm
        run: |
          # Find all .wasm files tracked in the repository
          WASM_FILES=$(find . -name "*.wasm" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            2>/dev/null || true)

          if [ -z "$WASM_FILES" ]; then
            echo "No .wasm files found in repository. Nothing to verify."
            echo "has_wasm=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found WASM files:"
            echo "$WASM_FILES"
            echo "has_wasm=true" >> "$GITHUB_OUTPUT"
            echo "wasm_files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$WASM_FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify checksums against .wasm-checksums
        if: steps.find-wasm.outputs.has_wasm == 'true'
        run: |
          if [ ! -f ".wasm-checksums" ]; then
            echo "::error::.wasm-checksums file is missing. WASM artifacts are present but have no recorded checksums."
            echo "Run: sha256sum \$(find . -name '*.wasm' -not -path './.git/*' -not -path './node_modules/*') > .wasm-checksums"
            echo "Then commit .wasm-checksums to the repository."
            exit 1
          fi

          echo "Verifying WASM file integrity against recorded checksums..."
          sha256sum --check .wasm-checksums
          echo "All WASM checksums verified successfully."

      - name: Detect unregistered WASM files
        if: steps.find-wasm.outputs.has_wasm == 'true'
        run: |
          # Ensure every .wasm file in the repo appears in .wasm-checksums
          UNREGISTERED=""
          while IFS= read -r wasm_file; do
            # Strip leading ./ for consistent comparison
            normalized="${wasm_file#./}"
            if ! grep -q "$normalized" .wasm-checksums 2>/dev/null; then
              UNREGISTERED="$UNREGISTERED $normalized"
            fi
          done <<< "${{ steps.find-wasm.outputs.wasm_files }}"

          if [ -n "$UNREGISTERED" ]; then
            echo "::error::The following WASM files are not registered in .wasm-checksums:$UNREGISTERED"
            echo "Add them with: sha256sum$UNREGISTERED >> .wasm-checksums"
            exit 1
          fi

          echo "All WASM files are registered in .wasm-checksums."

      - name: Check for stale checksum entries
        if: steps.find-wasm.outputs.has_wasm == 'true'
        run: |
          # Warn if .wasm-checksums references files that no longer exist
          STALE=""
          while IFS= read -r line; do
            # Each line in sha256sum format: "<hash>  <path>"
            recorded_path=$(echo "$line" | awk '{print $2}')
            if [ ! -f "$recorded_path" ]; then
              STALE="$STALE\n  $recorded_path"
            fi
          done < .wasm-checksums

          if [ -n "$STALE" ]; then
            echo "::warning::Stale entries in .wasm-checksums (files no longer exist):$STALE"
            echo "Remove stale entries by regenerating: sha256sum \$(find . -name '*.wasm' ...) > .wasm-checksums"
          fi

      - name: Skip — no WASM artifacts present
        if: steps.find-wasm.outputs.has_wasm == 'false'
        run: |
          echo "No WASM artifacts found. This is expected until Soroban contracts are compiled and committed."
          echo "See WASM_INTEGRITY.md for instructions on registering contract artifacts."

  verify-wasm-hash:
    name: Verify WASM Hash Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      contracts_present: ${{ steps.workspace.outputs.present }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check contracts workspace
        id: workspace
        shell: bash
        run: |
          if [ -f contracts/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Contracts workspace is not present in this checkout; skipping contract WASM verification."
          fi

      - name: Fetch token WASM artifact
        if: steps.workspace.outputs.present == 'true'
        working-directory: contracts
        run: bash scripts/fetch_token_wasm.sh

      - name: Verify WASM artifact hash
        if: steps.workspace.outputs.present == 'true'
        working-directory: contracts
        run: |
          WASM_FILE="soroban_token_contract.wasm"
          EXPECTED_HASH=$(grep -E '^EXPECTED_HASH=' scripts/verify_wasm_hash.sh | head -n1 | cut -d'"' -f2)

          if [ -z "$EXPECTED_HASH" ]; then
            echo "❌ FAIL: Could not determine EXPECTED_HASH from scripts/verify_wasm_hash.sh"
            exit 1
          fi

          if [ ! -f "$WASM_FILE" ]; then
            echo "❌ FAIL: WASM file not found: $WASM_FILE"
            echo "Supply chain risk: Token contract artifact missing"
            exit 1
          fi

          ACTUAL_HASH=$(sha256sum "$WASM_FILE" | awk '{print $1}')

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "❌ FAIL: WASM hash mismatch!"
            echo "Expected: $EXPECTED_HASH"
            echo "Actual:   $ACTUAL_HASH"
            echo ""
            echo "Supply chain risk detected - build will not proceed"
            exit 1
          fi

          echo "✅ PASS: WASM hash verified"
          echo "Hash: $ACTUAL_HASH"

      - name: Verify hash consistency across contracts
        if: steps.workspace.outputs.present == 'true'
        working-directory: contracts
        run: |
          EXPECTED_HASH=$(grep -E '^EXPECTED_HASH=' scripts/verify_wasm_hash.sh | head -n1 | cut -d'"' -f2)

          if [ -z "$EXPECTED_HASH" ]; then
            echo "❌ FAIL: Could not determine EXPECTED_HASH from scripts/verify_wasm_hash.sh"
            exit 1
          fi

          echo "Checking hash consistency in contract imports..."

          for contract in acbu_minting acbu_burning acbu_reserve_tracker; do
            FILE="$contract/src/lib.rs"
            if grep -q "contractimport!" "$FILE" && ! grep -q "sha256 = \"$EXPECTED_HASH\"" "$FILE"; then
              echo "❌ FAIL: Hash mismatch in $FILE"
              echo "Expected hash not found in contract import"
              exit 1
            fi
            echo "✅ $contract: Hash consistent"
          done

          echo "✅ All contracts have consistent WASM hash"

      - name: Check for hash in git history
        if: steps.workspace.outputs.present == 'true'
        working-directory: contracts
        run: |
          echo "Verifying WASM file integrity in git history..."

          CURRENT_HASH=$(sha256sum soroban_token_contract.wasm | awk '{print $1}')

          if git show --name-only HEAD | grep -q "contracts/soroban_token_contract.wasm"; then
            echo "⚠️  WARNING: WASM file modified in this commit"
            echo "Current hash: $CURRENT_HASH"
            echo "Ensure all contract imports are updated with new hash"
          fi

  build-verification:
    name: Build Contracts with Hash Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-wasm-hash
    if: needs.verify-wasm-hash.outputs.contracts_present == 'true'
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/rust-toolchain.toml') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/rust-toolchain.toml') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: contracts/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/rust-toolchain.toml') }}

      - name: Fetch token WASM artifact
        run: bash scripts/fetch_token_wasm.sh

      - name: Run WASM verification script
        run: bash scripts/verify_wasm_hash.sh

      - name: Build contracts
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      - name: Check Contract Budget
        run: ./scripts/check_budget.sh

      - name: Verify build artifacts
        run: |
          echo "Verifying build artifacts..."

          for contract in acbu_minting acbu_burning acbu_oracle acbu_reserve_tracker acbu_savings_vault acbu_lending_pool acbu_escrow acbu_multisig; do
            WASM="target/wasm32-unknown-unknown/release/$contract.wasm"
            if [ ! -f "$WASM" ]; then
              echo "❌ FAIL: Build artifact missing: $WASM"
              exit 1
            fi
            HASH=$(sha256sum "$WASM" | awk '{print $1}')
            echo "✅ $contract.wasm: $HASH"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-artifacts
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 30

  pinned-build:
    name: Verify Pinned Contract Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-wasm-hash
    if: needs.verify-wasm-hash.outputs.contracts_present == 'true'
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown

      - name: Restore cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-pinned-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pinned-

      - name: Fetch token WASM artifact
        run: bash scripts/fetch_token_wasm.sh

      - name: Build native workspace crates
        run: cargo build --workspace

      - name: Build WASM workspace crates
        run: cargo build --workspace --target wasm32-unknown-unknown --release
