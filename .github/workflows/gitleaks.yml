# Secret-scanning CI gate — closes issue #767 (W2-B-057: No secrets scanning in CI).
# Fails the build if a real or test secret (e.g. a fake AWS key) is committed.
name: Secret Scan (gitleaks)

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to inspect the exact PR/push commit range.
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.2"
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -zxf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks on introduced commits
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$GITLEAKS_BASE_SHA" || "$GITLEAKS_BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::Unable to determine the base commit for the Gitleaks range."
            exit 1
          fi
          gitleaks detect --source . --config .gitleaks.toml --log-opts="$GITLEAKS_BASE_SHA..$GITHUB_SHA" --verbose --redact
