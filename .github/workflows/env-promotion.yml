name: Environment Promotion Pipeline (dev -> staging -> prod)

# Controlled environment promotion pipeline enforcing:
# 1. Schema drift detection & migration safety gates
# 2. Automated Staging deployment & smoke tests
# 3. Guarded Production promotion with environment approvals & rollback readiness
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment to promote to"
        required: true
        type: choice
        options:
          - "staging"
          - "production"
          - "dev-to-staging-to-prod"
        default: "dev-to-staging-to-prod"
      ref:
        description: "Git ref, commit SHA, or tag to deploy"
        required: false
        default: "main"

concurrency:
  group: env-promotion-${{ github.event.inputs.target_environment || 'auto' }}
  cancel-in-progress: false

jobs:
  # ── Stage 1: Pre-flight Verification & Migration Drift Gate ────────────────
  preflight-and-drift-gate:
    name: 1. Pre-flight & Migration Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.33.1"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Static Migration SQL Guard
        run: node scripts/ci/check-migration-sql.js

      - name: Destructive Migration Guard
        run: node scripts/ci/check-destructive-migrations.js

      - name: Verify Down-Migrations & Schema Drift Guard
        run: pnpm run prisma:drift:check

      - name: Compile check
        run: pnpm run build

  # ── Stage 2: Promote to Staging ─────────────────────────────────────────────
  promote-staging:
    name: 2. Promote to Staging
    needs: [preflight-and-drift-gate]
    if: |
      github.event_name == 'push' ||
      github.event.inputs.target_environment == 'staging' ||
      github.event.inputs.target_environment == 'dev-to-staging-to-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.33.1"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Staging Database Migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          echo "[staging-migration] Applying migrations to Staging..."
          pnpm prisma:generate
          pnpm prisma:migrate:deploy

      - name: Deploy Image to Staging
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          echo "::notice::Deploying commit ${{ github.sha }} to staging environment."
          # Deployment invocation command

      - name: Staging Health Check & Smoke Test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "::warning::STAGING_URL not set — skipping HTTP health check."
            exit 0
          fi
          echo "Waiting for $STAGING_URL/api/v1/health/ready ..."
          for i in $(seq 1 18); do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 "$STAGING_URL/api/v1/health/ready" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging deployment healthy on attempt $i."
              exit 0
            fi
            echo "  Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "::error::Staging health check failed after 3 minutes."
          exit 1

  # ── Stage 3: Promote to Production ──────────────────────────────────────────
  promote-production:
    name: 3. Promote to Production
    needs: [preflight-and-drift-gate, promote-staging]
    if: |
      github.event.inputs.target_environment == 'production' ||
      github.event.inputs.target_environment == 'dev-to-staging-to-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Requires manual reviewer approval configured in GitHub Environment settings
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.33.1"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-migration Production Backup & Rollback Verification
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "[prod-migration] Checking down-migration availability for rollback safety..."
          pnpm run prisma:drift:check
          echo "[prod-migration] Pre-migration check passed."

      - name: Run Production Database Migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "[prod-migration] Executing production schema migrations..."
          pnpm prisma:generate
          pnpm prisma:migrate:deploy

      - name: Deploy Image to Production
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          echo "::notice::Deploying verified commit ${{ github.sha }} to production."

      - name: Production Smoke Tests & Health Check
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL not set — skipping HTTP health check."
            exit 0
          fi
          echo "Waiting for $PRODUCTION_URL/api/v1/health/ready ..."
          for i in $(seq 1 24); do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 "$PRODUCTION_URL/api/v1/health/ready" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Production deployment is live and healthy."
              exit 0
            fi
            echo "  Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "::error::Production deployment failed health check. Trigger rollback runbook."
          exit 1
