# Semgrep security scans for backend, frontend, and Soroban contract code.
name: "Semgrep"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: returntocorp/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run repository rules and general registry rules
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config p/owasp-top-ten \
            --config p/security-audit \
            # This rule's Bash parser fails on GitHub Actions expression syntax.
            --exclude-rule yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell \
            --exclude '**/node_modules/**' \
            --exclude '**/target/**' \
            --exclude '**/dist/**' \
            --exclude '**/.next/**' \
            --exclude '*.generated.*' \
            --error \
            --severity ERROR \
            --json \
            --output semgrep-report.json \
            .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Run frontend registry rules
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/react \
            --config p/security-audit \
            --include '**/frontend/**' \
            --include '**/acbu-frontend/**' \
            --exclude '**/node_modules/**' \
            --exclude '**/target/**' \
            --exclude '**/dist/**' \
            --exclude '**/.next/**' \
            --exclude '*.generated.*' \
            --error \
            --severity ERROR \
            --json \
            --output semgrep-frontend-report.json \
            .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Run contracts registry rules
        run: |
          semgrep scan \
            --config p/rust \
            --include '**/contracts/**' \
            --exclude '**/node_modules/**' \
            --exclude '**/target/**' \
            --exclude '**/dist/**' \
            --exclude '**/.next/**' \
            --exclude '*.generated.*' \
            --error \
            --severity ERROR \
            --json \
            --output semgrep-contracts-report.json \
            .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-*-report.json
          retention-days: 30
