name: Event Schema Contract Check

on:
  pull_request:
    paths:
      - "shared/events-schema.json"
      - "src/jobs/acbu_*_event_listener.ts"
      - "scripts/check-event-schema.js"
      - "scripts/check-event-schema.test.js"
      - "package.json"
      - ".github/workflows/event-schema-check.yml"
  push:
    branches: [main, dev]
    paths:
      - "shared/events-schema.json"
      - "src/jobs/acbu_*_event_listener.ts"
      - "scripts/check-event-schema.js"
      - "scripts/check-event-schema.test.js"
      - "package.json"
      - ".github/workflows/event-schema-check.yml"

jobs:
  event-schema:
    name: Validate event schema contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check event schema
        run: pnpm run event-schema:check

      - name: Test event schema drift detection
        run: pnpm run test:event-schema
