[workspace]
resolver = "2"
members = [
    "contracts/acbu_oracle",
    "contracts/acbu_minting",
    "contracts/acbu_burning",
    "contracts/acbu_savings_vault",
    "contracts/acbu_escrow",
    "contracts/acbu_lending_pool",
    "contracts/acbu_fee_collector",
    "contracts/acbu_reserve",
    "contracts/acbu_token",
    "contracts/acbu_governance",
]

[workspace.package]
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1
