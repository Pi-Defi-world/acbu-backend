name: Deploy Contracts

# W2-C-062: guarded deploy pipeline with contract-address registry.
#
# Trigger: manual only (workflow_dispatch).  No automated pushes trigger a
# real-chain deploy.  A separate CI workflow handles build/test on every PR.
#
# Mainnet guard: the caller must type "deploy" in the `confirm` input AND the
# workflow environment ("mainnet") requires a GitHub Environment protection
# rule (required reviewers / deploy branch filter) to be configured in the
# repo settings.
#
# Registry: after a successful deploy, scripts/update_registry.sh merges the
# new contract addresses into deployments/registry.json.  The workflow commits
# that file back to the source branch so the registry is always up-to-date in
# version control.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target Stellar network"
        type: choice
        required: true
        default: testnet
        options:
          - testnet
          - mainnet
      confirm:
        description: 'Mainnet only — type "deploy" to confirm (required for mainnet)'
        type: string
        required: false
        default: ""

# Prevent concurrent deploys to the same network — never cancel in-progress.
concurrency:
  group: deploy-${{ github.event.inputs.network }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Guard job: validates inputs before any expensive work starts.
  # ---------------------------------------------------------------------------
  guard:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    steps:
      - name: Mainnet confirmation check
        if: github.event.inputs.network == 'mainnet'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Mainnet deploy requires the 'confirm' input to be set to exactly \"deploy\"."
            echo "::error::Re-run the workflow with confirm=deploy to proceed."
            exit 1
          fi
          echo "✅ Mainnet confirmation accepted."

      - name: Testnet confirmation
        if: github.event.inputs.network == 'testnet'
        run: echo "✅ Testnet deploy — no extra confirmation required."

  # ---------------------------------------------------------------------------
  # Deploy job: builds contracts and deploys them to the target network.
  # Runs only after the guard job passes.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ github.event.inputs.network }}
    needs: guard
    # Mainnet signing is confined to an approved runner with a preconfigured
    # MPC/HSM or hardware-backed Stellar CLI identity. Raw seeds never enter CI.
    runs-on: ${{ github.event.inputs.network == 'mainnet' && fromJSON('["self-hosted","mainnet-signer"]') || 'ubuntu-latest' }}
    # Each network maps to a GitHub Environment so that:
    #   - testnet: inherits STELLAR_SECRET_KEY (testnet key)
    #   - mainnet: requires reviewer approval + branch protection via GitHub UI
    environment: ${{ github.event.inputs.network }}

    permissions:
      contents: write   # needed to commit the updated registry back
      id-token: write   # keyless signatures for build/address artifacts

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can push the registry commit back
          fetch-depth: 0

      # -----------------------------------------------------------------------
      - name: Validate testnet signing secret
        if: github.event.inputs.network == 'testnet'
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          if [ -z "${STELLAR_SECRET_KEY:-}" ]; then
            echo "::error::The STELLAR_SECRET_KEY secret is not configured for the"
            echo "::error::'${{ github.event.inputs.network }}' GitHub Environment."
            echo "::error::Add it at: Settings → Environments → ${{ github.event.inputs.network }} → Secrets"
            exit 1
          fi
          echo "✅ STELLAR_SECRET_KEY is present (not echoed for security)."

      - name: Validate mainnet signer identity
        if: github.event.inputs.network == 'mainnet'
        env:
          STELLAR_SIGNER: ${{ vars.MAINNET_SIGNER_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$STELLAR_SIGNER" || {
            echo "::error::MAINNET_SIGNER_IDENTITY is not configured in the mainnet environment."
            exit 1
          }
          echo "✅ Mainnet signer identity is configured."

      # -----------------------------------------------------------------------
      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # -----------------------------------------------------------------------
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-deploy-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deploy-

      # -----------------------------------------------------------------------
      # W2-Z-016: Pin Node 20 LTS; Node 18 is EOL (AZ-031).
      # Required for createJsonArgs.js and other JS helper scripts invoked
      # during the deploy pipeline.
      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # -----------------------------------------------------------------------
      - name: Install Stellar CLI
        uses: ./.github/actions/stellar-cli

      - name: Verify mainnet signer is available to Stellar CLI
        if: github.event.inputs.network == 'mainnet'
        env:
          STELLAR_SIGNER: ${{ vars.MAINNET_SIGNER_IDENTITY }}
        run: stellar keys address "$STELLAR_SIGNER" >/dev/null

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and sign deployment artifacts
        run: |
          set -euo pipefail
          cargo build --locked --workspace --target wasm32-unknown-unknown --release
          find target/wasm32-unknown-unknown/release -name '*.wasm' -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > deployment-artifacts.sha256
          test -s deployment-artifacts.sha256
          cosign sign-blob --yes \
            --bundle deployment-artifacts.sigstore.json \
            deployment-artifacts.sha256

      # -----------------------------------------------------------------------
      - name: Fetch vendored token WASM
        run: bash scripts/fetch_token_wasm.sh

      # -----------------------------------------------------------------------
      - name: Pre-deploy WASM integrity check
        run: bash scripts/verify_deployment.sh "${{ github.event.inputs.network }}" || true

      # -----------------------------------------------------------------------
      - name: Deploy contracts
        id: deploy
        env:
          STELLAR_SECRET_KEY: ${{ github.event.inputs.network == 'testnet' && secrets.STELLAR_SECRET_KEY || '' }}
          STELLAR_SIGNER: ${{ github.event.inputs.network == 'mainnet' && vars.MAINNET_SIGNER_IDENTITY || '' }}
          # Pass mainnet confirmation via env var (non-interactive guard in deploy.sh)
          DEPLOY_CONFIRM: ${{ github.event.inputs.network == 'mainnet' && github.event.inputs.confirm || '' }}
          # Initialisation parameters — real addresses come from GitHub
          # Environment *variables* (Settings → Environments → <network> →
          # Variables).  deploy.sh validates them (non-empty, non-placeholder)
          # before spending any XLM.  See DEPLOYMENT.md § Initialisation
          # parameters for the full list.
          ADMIN_ADDRESS: ${{ vars.ADMIN_ADDRESS }}
          ACBU_TOKEN_ID: ${{ vars.ACBU_TOKEN_ID }}
          USDC_TOKEN_ID: ${{ vars.USDC_TOKEN_ID }}
          VAULT_ADDRESS: ${{ vars.VAULT_ADDRESS }}
          TREASURY_ADDRESS: ${{ vars.TREASURY_ADDRESS }}
          WITHDRAWAL_PROCESSOR: ${{ vars.WITHDRAWAL_PROCESSOR }}
          OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
          OPERATOR_PUB_KEY: ${{ vars.OPERATOR_PUB_KEY }}
          ORACLE_VALIDATORS: ${{ vars.ORACLE_VALIDATORS }}
          ORACLE_MIN_SIGNATURES: ${{ vars.ORACLE_MIN_SIGNATURES }}
          MULTISIG_SIGNERS: ${{ vars.MULTISIG_SIGNERS }}
          MULTISIG_THRESHOLD: ${{ vars.MULTISIG_THRESHOLD }}
          MIN_RESERVE_RATIO_BPS: ${{ vars.MIN_RESERVE_RATIO_BPS }}
          MINT_FEE_RATE_BPS: ${{ vars.MINT_FEE_RATE_BPS }}
          MINT_FEE_SINGLE_BPS: ${{ vars.MINT_FEE_SINGLE_BPS }}
          BURN_FEE_RATE_BPS: ${{ vars.BURN_FEE_RATE_BPS }}
          BURN_FEE_SINGLE_REDEEM_BPS: ${{ vars.BURN_FEE_SINGLE_REDEEM_BPS }}
          SAVINGS_FEE_RATE_BPS: ${{ vars.SAVINGS_FEE_RATE_BPS }}
          SAVINGS_YIELD_RATE_BPS: ${{ vars.SAVINGS_YIELD_RATE_BPS }}
          LENDING_FEE_RATE_BPS: ${{ vars.LENDING_FEE_RATE_BPS }}
          SKIP_INIT: ${{ vars.DEPLOY_SKIP_INIT }}
        run: |
          bash scripts/deploy.sh "${{ github.event.inputs.network }}"

      - name: Sign deployment address record
        run: |
          set -euo pipefail
          test -s "deployments/${{ github.event.inputs.network }}.json"
          cosign sign-blob --yes \
            --bundle "deployments/${{ github.event.inputs.network }}.sigstore.json" \
            "deployments/${{ github.event.inputs.network }}.json"

      # -----------------------------------------------------------------------
      - name: Commit registry back to source branch
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deployments/

          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "chore(deploy): update contract registry for ${{ github.event.inputs.network }} [skip ci]

            Deployed by: ${{ github.actor }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Network: ${{ github.event.inputs.network }}
            Git ref: ${{ github.ref }}"

            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Registry committed and pushed to ${{ github.ref_name }}."
          fi

      # -----------------------------------------------------------------------
      - name: Upload deployment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.event.inputs.network }}-run${{ github.run_id }}
          path: |
            deployments/${{ github.event.inputs.network }}.json
            deployments/${{ github.event.inputs.network }}.sigstore.json
            deployments/registry.json
            deployment-artifacts.sha256
            deployment-artifacts.sigstore.json
          if-no-files-found: warn
          retention-days: 90

      # -----------------------------------------------------------------------
      - name: Job summary
        if: always()
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          NET_FILE="deployments/${NETWORK}.json"
          REG_FILE="deployments/registry.json"

          {
            echo "## ACBU Contract Deploy — ${NETWORK}"
            echo ""
            echo "| Field | Value |"
            echo "| ----- | ----- |"
            echo "| Network    | \`${NETWORK}\` |"
            echo "| Triggered by | @${{ github.actor }} |"
            echo "| Run ID     | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Commit     | \`${{ github.sha }}\` |"
            echo ""

            if [ -f "$NET_FILE" ]; then
              echo "### Contract Addresses"
              echo ""
              echo '```json'
              cat "$NET_FILE"
              echo '```'
            else
              echo "> ⚠️ Deployment file not found — deploy may have failed."
            fi

            if [ -f "$REG_FILE" ]; then
              echo ""
              echo "### Full Registry"
              echo ""
              echo '```json'
              cat "$REG_FILE"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
